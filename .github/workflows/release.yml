name: release
on:
  push:
    tags: ["v*"]
jobs:
  npm:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "22", registry-url: "https://registry.npmjs.org" }
      - run: npm install -g npm@latest
      - run: npm ci && npm run build
      - name: Publish unless this version is already on npm
        run: |
          NAME=$(node -p "require('./package.json').name"); VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then echo "$NAME@$VERSION already published, skipping"; else npm publish --access public; fi
  release:
    needs: npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes "npm package only; see CHANGELOG.md"
        env: { GH_TOKEN: "${{ github.token }}" }
